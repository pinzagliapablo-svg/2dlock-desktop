name: Build and publish 2Dlock for Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild (for example v3.0.0). Leave empty to publish the current package.json version.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      UPDATE_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout the requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Resolve release version and create release when needed
        id: resolve_release
        shell: pwsh
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          $releaseTag = $env:RELEASE_TAG_INPUT
          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            $releaseTag = $expectedTag
          }
          if ($releaseTag -ne $expectedTag) {
            throw "Il tag '$releaseTag' non corrisponde alla versione package.json '$expectedTag'."
          }

          gh release view $releaseTag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          if (-not $releaseExists) {
            $targetCommit = $env:GITHUB_SHA
            if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_TAG_INPUT)) {
              $targetCommit = $env:RELEASE_TAG_INPUT
            }
            gh release create $releaseTag --title "2Dlock $releaseTag" --notes "Release automatica di 2Dlock." --target $targetCommit --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) {
              throw "Impossibile creare la release GitHub '$releaseTag'."
            }
            Write-Host "Creata la release $releaseTag."
          } elseif ($env:GITHUB_EVENT_NAME -eq "push" -or [string]::IsNullOrWhiteSpace($env:RELEASE_TAG_INPUT)) {
            throw "La release '$releaseTag' esiste già. Incrementa version in package.json e package-lock.json prima di pubblicare un altro aggiornamento."
          } else {
            Write-Host "Release esistente verificata: $releaseTag"
          }

          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TAG=$releaseTag" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$releaseTag" -Encoding utf8

      - name: Build Windows installer
        shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          npx electron-builder --config electron-builder.config.cjs --win nsis --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          UPDATE_REPO: ${{ github.repository }}

      - name: Verify installer and generate updater manifest
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $installer = Get-ChildItem -Path dist -File -Filter '*.exe' |
            Where-Object { $_.Name -notmatch 'uninstall' } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $installer) {
            Write-Host 'Contenuto della cartella dist:'
            if (Test-Path dist) { Get-ChildItem dist -Recurse | Format-Table FullName, Length }
            throw 'La build è terminata senza produrre alcun installer .exe. Non pubblico una release vuota.'
          }

          $shaAlgorithm = [System.Security.Cryptography.SHA512]::Create()
          $stream = [System.IO.File]::OpenRead($installer.FullName)
          try { $digest = $shaAlgorithm.ComputeHash($stream) }
          finally { $stream.Dispose(); $shaAlgorithm.Dispose() }
          $sha512 = [Convert]::ToBase64String($digest)
          $releaseDate = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          $manifest = @"
          version: $($package.version)
          files:
            - url: $($installer.Name)
              sha512: $sha512
              size: $($installer.Length)
          path: $($installer.Name)
          sha512: $sha512
          releaseDate: "$releaseDate"
          "@
          $manifestPath = Join-Path (Resolve-Path dist) 'latest.yml'
          [System.IO.File]::WriteAllText($manifestPath, ($manifest.Trim() + "`n"), [System.Text.UTF8Encoding]::new($false))

          Write-Host 'File generati:'
          Get-ChildItem -Path dist -File | Format-Table Name, Length
          if (-not (Test-Path $manifestPath)) { throw 'latest.yml non è stato creato.' }

      - name: Save installer as a downloadable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2Dlock-Windows-${{ steps.resolve_release.outputs.tag }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer and updater files to GitHub Release
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -Path dist -File | Where-Object {
            $_.Extension -eq '.exe' -or $_.Name -like '*.blockmap' -or $_.Name -eq 'latest.yml'
          })
          if (-not ($assets | Where-Object { $_.Extension -eq '.exe' })) {
            throw 'Non trovo il file .exe da caricare.'
          }
          if (-not ($assets | Where-Object { $_.Name -eq 'latest.yml' })) {
            throw 'Non trovo latest.yml da caricare.'
          }
          $ghArgs = @('release', 'upload', $env:RELEASE_TAG) + @($assets | ForEach-Object { $_.FullName }) + @('--clobber', '--repo', $env:GITHUB_REPOSITORY)
          Write-Host "Caricamento asset sulla release $env:RELEASE_TAG :"
          $assets | ForEach-Object { Write-Host " - $($_.Name) ($($_.Length) bytes)" }
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub CLI non è riuscito a caricare gli asset. Controlla i permessi contents: write.'
          }
          Write-Host 'Installer e manifest caricati correttamente.'
